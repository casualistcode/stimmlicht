<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b0a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Ein Licht, das im Takt der Schwebung pulsiert – Hilfe beim Legen der gleichstufigen Temperatur nach Gehör.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stimmlicht">
<title>Stimmlicht</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c0b0a'/%3E%3Ccircle cx='32' cy='32' r='25' fill='none' stroke='%23ffffff' stroke-opacity='.25' stroke-width='1.5' stroke-dasharray='6.5 6.6'/%3E%3Ccircle cx='32' cy='32' r='15' fill='%23ff9a2e'/%3E%3C/svg%3E">
<style>
  :root {
    /* Durchmesser des Quintenzirkels – alles andere richtet sich danach.
       Das ist nur der Startwert; das Skript misst den freien Platz und setzt den genauen Wert. */
    --d: max(120px, min(90vw, calc(100vh - 390px), 460px));
    --d: max(120px, min(90vw, calc(100dvh - 390px), 460px));

    --grund: #0c0b0a;
    --text:  #f3eee6;
    --leise: #9c958b;
    --orange: #ffab52;
    --blau:   #7ab8ff;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans:  system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }

  /* Orange = eng, Blau = weit, warmes Weiß = rein (Oktave).
     body trägt die Farbe des Hauptintervalls; das Licht kann eine eigene tragen (angetippte Probe). */
  body.eng,  .licht.eng  { --rgb: 255, 140, 26;  --akzent: var(--orange); --kern: #ffe0b3; --mitte: #ffa53f; --rand: #ff8514; }
  body.weit, .licht.weit { --rgb: 47, 140, 255;  --akzent: var(--blau);   --kern: #dcecff; --mitte: #66afff; --rand: #2687ff; }
  body.rein, .licht.rein { --rgb: 255, 236, 205; --akzent: #efe2cc;       --kern: #fffaf2; --mitte: #f4e6cf; --rand: #e6cfab; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { height: 100%; background: var(--grund); overflow: hidden; overscroll-behavior: none; }

  /* Die Seite füllt genau den sichtbaren Bereich: nichts scrollt, nichts verschiebt sich */
  body {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    overflow: hidden;
    overflow: clip;               /* auch der Lichtschein kann nichts verschieben */
    overscroll-behavior: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 5vw max(16px, env(safe-area-inset-bottom));
    background: var(--grund);
    color: var(--text);
    font-family: var(--sans);
    text-align: center;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid rgba(255, 255, 255, .55); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- Kopfzeile: Name, darunter Zirkel und Kammerton ---------- */
  header {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 52px;
    color: var(--leise);
    white-space: nowrap;
  }
  .marke {
    font-size: .66rem;
    font-weight: 600;
    letter-spacing: .3em;
    text-transform: uppercase;
    opacity: .7;
  }
  .einstellung {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 24px;
    margin-top: 6px;
    font-size: .78rem;
    letter-spacing: .04em;
  }
  .punkt { margin: 0 .7em; opacity: .6; }

  /* Zirkel und Kammerton: antippen zum Ändern */
  .wahl, #kammerton {
    position: relative;
    padding: 9px 6px;
    margin: -9px -6px;
    letter-spacing: inherit;
    text-decoration: underline dotted rgba(255, 255, 255, .32);
    text-underline-offset: .4em;
  }
  /* unsichtbare Auswahlliste über dem Zirkelnamen: öffnet die Auswahl des Geräts */
  #zirkelwahl {
    position: absolute;
    left: 0; top: 0; width: 100%; height: 100%;
    opacity: 0;
    font-size: 16px;
    border: 0;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .wahl:focus-within { outline: 2px solid rgba(255, 255, 255, .55); outline-offset: -2px; border-radius: 6px; }

  #feld { font-size: 1rem; letter-spacing: .03em; color: var(--text); }
  #eingabe {
    width: 4.6em;
    margin: 0 .15em;
    padding: 3px 6px;
    font: inherit;
    font-size: 16px;              /* unter 16px zoomt das iPhone beim Antippen */
    color: var(--text);
    text-align: center;
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 8px;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }

  sup { font-size: .6em; line-height: 0; vertical-align: .58em; margin-left: .03em; }
  sub { font-size: .6em; line-height: 0; vertical-align: -.2em; }

  /* ---------- Bühne ---------- */
  main {
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  /* ---------- Quintenzirkel mit Licht ---------- */
  .zirkel {
    position: relative;
    flex: none;
    width: var(--d);
    height: var(--d);
  }

  .fassung, .kern {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(var(--d) * .6);
    height: calc(var(--d) * .6);
    margin: calc(var(--d) * -.3) 0 0 calc(var(--d) * -.3);
    border-radius: 50%;
  }

  /* bleibt immer schwach sichtbar */
  .fassung {
    border: 1px solid rgba(255, 255, 255, .1);
    background: rgba(255, 255, 255, .018);
  }

  /* pulsiert: die Deckkraft wird per JavaScript gesetzt */
  .licht {
    position: absolute;
    left: 0; top: 0; width: 100%; height: 100%;
    pointer-events: none;
    will-change: opacity;
  }

  .schein {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100vw;
    height: calc(var(--d) * 1.7);
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at center,
      rgba(var(--rgb), .30) 0,
      rgba(var(--rgb), .13) calc(var(--d) * .40),
      rgba(var(--rgb), .04) calc(var(--d) * .62),
      rgba(var(--rgb), 0)   calc(var(--d) * .85));
  }

  .kern {
    background: radial-gradient(circle at center, var(--kern) 0%, var(--mitte) 44%, var(--rand) 100%);
    box-shadow: 0 0 calc(var(--d) * .08) calc(var(--d) * .012) rgba(var(--rgb), .75);
  }

  .bahn {
    position: absolute;
    left: 0; top: 0; width: 100%; height: 100%;
    overflow: visible;
    pointer-events: none;
  }
  .bahn path {
    fill: none;
    stroke: rgba(255, 255, 255, .13);
    stroke-width: 1.5px;
    stroke-linecap: round;
    vector-effect: non-scaling-stroke;
    transition: stroke .25s;
  }
  .bahn path.fertig { stroke: rgba(255, 255, 255, .36); }
  .bahn path.aktiv  { stroke: var(--akzent); stroke-width: 2.5px; }

  /* Proben als innere Bögen von Ton zu Ton; antippen lässt das Licht in ihrem Takt pulsieren */
  .bahn path.pb      { stroke-width: 2px; opacity: .42; transition: opacity .2s; }
  .bahn path.pb.eng  { stroke: var(--orange); }
  .bahn path.pb.weit { stroke: var(--blau); }
  .bahn path.pb.rein { stroke: #efe2cc; }
  .bahn path.pb.an   { opacity: 1; stroke-width: 3px; }
  .bahn path.treffer { stroke: transparent; stroke-width: 16px; pointer-events: stroke; cursor: pointer; }

  /* Die zwölf Töne im Quintenzirkel: tippen springt zu dem Schritt, in dem der Ton gestimmt wird */
  .ton {
    position: absolute;
    width: max(44px, calc(var(--d) * .21));
    height: max(44px, calc(var(--d) * .21));
    transform: translate(-50%, -50%);
    border-radius: 50%;
    font-family: var(--serif);
    font-style: italic;
    font-size: max(13px, calc(var(--d) * .052));
    line-height: 1;
    color: rgba(255, 255, 255, .3);
    transition: color .25s;
  }
  .ton.fertig { color: rgba(255, 255, 255, .56); }
  .ton.bezug  { color: var(--text); }
  .ton.ziel   { color: var(--akzent); font-weight: 700; }
  .ton:active { color: var(--text); }
  .ton.probe-eng  { color: var(--orange); }
  .ton.probe-weit { color: var(--blau); }
  .ton.probe-rein { color: #efe2cc; }

  /* ---------- Angaben ---------- */
  /* Jede Zeile hat eine feste Höhe, damit der Block bei jedem Schritt gleich hoch ist */
  .angaben { flex: none; padding: 16px 0 18px; white-space: nowrap; }

  #schritt {
    height: 16px;
    line-height: 16px;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--leise);
  }

  #intervall {
    height: 1.2em;
    line-height: 1.2;
    margin-top: .28em;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(1.8rem, 9.2vw, 2.9rem);
  }

  #richtung {
    height: 32px;
    line-height: 32px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.55rem;
    color: var(--akzent);
  }

  #rate {
    height: 36px;
    line-height: 36px;
    font-size: 1rem;
    color: var(--leise);
  }
  #zahl {
    font-family: var(--serif);
    font-size: 1.6em;
    line-height: 1;
    color: var(--text);
    font-variant-numeric: lining-nums tabular-nums;
    margin-right: .12em;
  }

  /* Kontrollintervalle (nur bei Zirkeln, die welche haben): Platz für drei Zeilen, immer gleich hoch.
     Antippen lässt das Licht im Takt der Probe pulsieren. */
  #proben {
    height: 82px;
    padding-top: 6px;
    font-size: .8rem;
    color: var(--leise);
  }
  .probe {
    display: block;
    height: 25px;
    margin: 0 auto 1px;
    padding: 0 11px;
    line-height: 25px;
    border-radius: 13px;
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .probe.an { background: rgba(255, 255, 255, .1); color: var(--text); }
  #rate, #richtung, #intervall { transition: opacity .2s; }
  .angaben.probe-an #intervall,
  .angaben.probe-an #richtung,
  .angaben.probe-an #rate { opacity: .38; }
  #proben .vor  { opacity: .7; }
  #proben .ton2 { color: var(--text); }
  #proben .eng  { color: var(--orange); font-style: italic; }
  #proben .weit { color: var(--blau);   font-style: italic; }
  #proben .rein { color: #efe2cc;        font-style: italic; }
  #proben .wert { font-variant-numeric: tabular-nums; }

  /* ---------- Die zwei Tasten ---------- */
  nav {
    flex: none;
    display: flex;
    width: 100%;
    max-width: 460px;
  }
  nav button {
    flex: 1;
    height: clamp(68px, 11vh, 88px);
    border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 22px;
    background: rgba(255, 255, 255, .04);
    font-size: 1.22rem;
    font-weight: 500;
    letter-spacing: .01em;
    transition: background .15s, transform .15s;
  }
  nav button + button { margin-left: 12px; }
  #weiter { background: rgba(255, 255, 255, .085); border-color: rgba(255, 255, 255, .14); }
  nav button:active { background: rgba(255, 255, 255, .16); transform: scale(.98); }
  .pfeil { font-size: .62em; opacity: .55; vertical-align: .14em; margin: 0 .45em; }

  @media (hover: hover) {
    .ton:hover { color: var(--text); }
    .probe:hover { background: rgba(255, 255, 255, .06); }
    nav button:hover { background: rgba(255, 255, 255, .11); }
  }

  /* Handy quer: Licht links, Angaben rechts */
  @media (orientation: landscape) and (max-height: 540px) {
    :root {
      --d: max(120px, min(40vw, calc(100vh - 150px)));
      --d: max(120px, min(40vw, calc(100dvh - 150px)));
    }
    main { flex-direction: row; }
    .angaben { padding: 0; margin-left: 7vw; }
    #intervall { font-size: clamp(1.7rem, 5vw, 2.6rem); }
    nav { max-width: none; }
    nav button { height: 56px; }
  }
</style>
</head>
<body class="eng">

<header>
  <p class="marke">Stimmlicht</p>
  <p class="einstellung">
    <span class="wahl"><span id="zirkelname"></span><select id="zirkelwahl" aria-label="Stimmzirkel wählen"></select></span><span class="punkt">·</span><button id="kammerton" type="button"></button><span id="feld" hidden>a<sup>1</sup> = <input id="eingabe" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="Kammerton a1 in Hertz"> Hz</span>
  </p>
</header>

<main id="buehne">
  <div class="zirkel" id="zirkel">
    <div class="fassung"></div>
    <div class="licht" id="licht"><div class="schein"></div><div class="kern"></div></div>
    <svg class="bahn" id="bahn" viewBox="-100 -100 200 200" aria-hidden="true"></svg>
  </div>

  <div class="angaben" id="angaben" aria-live="polite">
    <p id="schritt"></p>
    <p id="intervall"></p>
    <p id="richtung"></p>
    <p id="rate"><span id="zahl"></span> Schwebungen/s</p>
    <div id="proben" hidden></div>
  </div>
</main>

<nav>
  <button id="zurueck" type="button"><span class="pfeil" aria-hidden="true">◀&#xFE0E;</span>Zurück</button>
  <button id="weiter" type="button">Weiter<span class="pfeil" aria-hidden="true">▶&#xFE0E;</span></button>
</nav>

<script>
  // ===== Einstellungen =====================================================
  const KAMMERTON_HZ = 440;   // Vorgabe für a1 in Hz; auf der Seite änderbar (Tipp auf „a¹ = 440 Hz“)
  const START_MIDI   = 69;    // Startton des Quintenzirkels (69 = a1); Oktave = Startton bis Startton + 12
  // =========================================================================

  const A1_MIDI = 69;
  const HZ_MIN = 200, HZ_MAX = 520;               // erlaubter Bereich für den Kammerton
  const SPEICHER        = "stimmlicht.kammerton";
  const SPEICHER_ZIRKEL = "stimmlicht.zirkel";

  // Reine Intervalle nach Halbtonabstand und das Verhältnis ihrer Koinzidenzteiltöne (oben : unten).
  // Schwebung = |unten · f_oberer Ton − oben · f_unterer Ton|, z. B. Quinte 3:2 → |2·f_oben − 3·f_unten|.
  // Positiv heißt: weiter als rein, negativ: enger als rein.
  const INTERVALLE = {
    3:  { art: "kleine Terz", oben: 6, unten: 5 },
    4:  { art: "Terz",        oben: 5, unten: 4 },
    5:  { art: "Quarte",      oben: 4, unten: 3 },
    7:  { art: "Quinte",      oben: 3, unten: 2 },
    9:  { art: "Sexte",       oben: 5, unten: 3 },
    12: { art: "Oktave",      oben: 2, unten: 1 }
  };

  // Quintenzirkel innerhalb der Temperaturoktave:
  // Quinte aufwärts, solange der neue Ton in der Oktave liegt, sonst Quarte abwärts.
  function quintenFolge() {
    const folge = [];
    let von = START_MIDI;
    for (let i = 0; i < 12; i++) {
      const nach = von + 7 <= START_MIDI + 12 ? von + 7 : von - 5;
      folge.push({ von: von, nach: nach, proben: [] });
      von = nach;
    }
    return folge;
  }

  // Vallotti: die sechs Quinten F–C–G–D–A–E–H um 1/6 pythagoreisches Komma verengt, H–Fis–Cis–Gis–Dis–B–F rein.
  // Ergebnis: Abweichung jeder Tonklasse von gleichstufig in Cent, bezogen auf a = 0.
  function vallottiAbweichung() {
    const rein  = 1200 * Math.log2(3 / 2);
    const komma = 1200 * Math.log2(Math.pow(3, 12) / Math.pow(2, 19));
    const eng   = rein - komma / 6;
    const lage  = [];                                     // Lage in Cent ab c, entlang der Quinten
    let cent = 0, tk = 0;
    lage[0] = 0;
    for (let i = 0; i < 5; i++) { cent += eng; tk = (tk + 7) % 12; lage[tk] = cent; }   // g d a e h
    cent = -eng; tk = 5; lage[5] = cent;                                                // f
    for (let i = 0; i < 5; i++) { cent -= rein; tk = (tk + 5) % 12; lage[tk] = cent; }  // b es as des ges
    const abw = lage.map(function (c, k) { const x = c - 100 * k; return x - 1200 * Math.round(x / 1200); });
    const a = abw[9];
    return abw.map(function (x) { return x - a; });
  }

  // Die wählbaren Stimmzirkel. MIDI-Nummern: d = 50, e = 52, f = 53, … a = 57, … c¹ = 60, … e¹ = 64.
  // Ohne „abweichung“ wird gleichstufig gerechnet.
  const ZIRKEL = {
    quinten: {
      titel: "Quintenzirkel",
      tonnamen: ["c", "cis", "d", "dis", "e", "f", "fis", "g", "gis", "a", "b", "h"],
      unten: START_MIDI, oben: START_MIDI + 12,
      bezugston: START_MIDI,
      folge: quintenFolge()
    },
    // Steinway-Stimmzirkel von e–e¹ nach Ulrich van Aaken (EUROPIANO 1985):
    // mit drei großen Terzen und Kontrollintervallen („Proben“) nach jedem Schritt.
    steinway: {
      titel: "Steinway-Zirkel",
      tonnamen: ["c", "cis", "d", "es", "e", "f", "fis", "g", "gis", "a", "b", "h"],
      unten: 52, oben: 64,
      bezugston: 57,
      folge: [
        { von: 57, nach: 53, proben: [] },                               //  1 Terz a → f
        { von: 57, nach: 62, proben: [[53, 62]] },                       //  2 Quarte a → d¹ · Sexte f–d¹
        { von: 53, nach: 58, proben: [[58, 62]] },                       //  3 Quarte f → b · Terz b–d¹
        { von: 62, nach: 55, proben: [[55, 58]] },                       //  4 Quarte d¹ → g · kleine Terz g–b
        { von: 55, nach: 60, proben: [[53, 60], [57, 60]] },             //  5 Quarte g → c¹ · Quinte f–c¹, kleine Terz a–c¹
        { von: 58, nach: 54, proben: [] },                               //  6 Terz b → fis
        { von: 54, nach: 59, proben: [[55, 59], [53, 62]] },             //  7 Quarte fis → h · Terz g–h, Sexte f–d¹
        { von: 59, nach: 64, proben: [[57, 64], [60, 64], [55, 64]] },   //  8 Quarte h → e¹ · Quinte a–e¹, Terz c¹–e¹, Sexte g–e¹
        { von: 64, nach: 52, proben: [[52, 57], [52, 59]] },             //  9 Oktave e¹ → e · Quarte e–a, Quinte e–h
        { von: 52, nach: 56, proben: [[56, 60]] },                       // 10 Terz e → gis · Terz gis–c¹
        { von: 56, nach: 61, proben: [[57, 61], [54, 61], [52, 61]] },   // 11 Quarte gis → cis¹ · Terz a–cis¹, Quinte fis–cis¹, Sexte e–cis¹
        { von: 58, nach: 63, proben: [] }                                // 12 Quarte b → es¹
      ]
    },
    // Vallotti, Temperaturoktave d–d¹: von a aus Terz, Quarte und Quinte abwärts,
    // dann von f aus die reinen Quinten bis h, zuletzt die verengten Quinten d–g–c¹.
    vallotti: {
      titel: "Vallotti",
      tonnamen: ["c", "cis", "d", "es", "e", "f", "fis", "g", "gis", "a", "b", "h"],
      abweichung: vallottiAbweichung(),
      unten: 50, oben: 62,
      bezugston: 57,
      folge: [
        { von: 57, nach: 53, proben: [] },                               //  1 Terz a → f
        { von: 57, nach: 52, proben: [] },                               //  2 Quarte a → e
        { von: 57, nach: 50, proben: [[50, 53]] },                       //  3 Quinte a → d · kleine Terz d–f
        { von: 53, nach: 58, proben: [] },                               //  4 Quarte f → b (rein)
        { von: 58, nach: 51, proben: [] },                               //  5 Quinte b → es (rein)
        { von: 51, nach: 56, proben: [] },                               //  6 Quarte es → gis (rein)
        { von: 56, nach: 61, proben: [] },                               //  7 Quarte gis → cis¹ (rein)
        { von: 61, nach: 54, proben: [[50, 54]] },                       //  8 Quinte cis¹ → fis (rein) · Terz d–fis
        { von: 54, nach: 59, proben: [[52, 59]] },                       //  9 Quarte fis → h (rein) · Quinte e–h
        { von: 50, nach: 55, proben: [[55, 59]] },                       // 10 Quarte d → g · Terz g–h
        { von: 55, nach: 60, proben: [[53, 60], [56, 60], [57, 61]] }    // 11 Quarte g → c¹ · Quinte f–c¹, Terz gis–c¹, Terz a–cis¹
      ]
    }
  };

  // Kammerton und Zirkel: zuletzt auf diesem Gerät eingestellt, sonst die Vorgabe
  let kammerton = KAMMERTON_HZ;
  let gemerkterZirkel = "quinten";
  try {
    const gemerkt = parseFloat(localStorage.getItem(SPEICHER));
    if (gemerkt >= HZ_MIN && gemerkt <= HZ_MAX) kammerton = gemerkt;
    gemerkterZirkel = localStorage.getItem(SPEICHER_ZIRKEL) || gemerkterZirkel;
  } catch (e) {}

  let zirkelId = "quinten";
  let tonnamen = ZIRKEL.quinten.tonnamen;

  // Frequenz zur MIDI-Notennummer n: gleichstufig, verschoben um die Abweichung der gewählten Stimmung
  function frequenz(n) {
    const abw = ZIRKEL[zirkelId].abweichung;
    const cent = abw ? abw[((n % 12) + 12) % 12] : 0;
    return kammerton * Math.pow(2, (n - A1_MIDI) / 12 + cent / 1200);
  }

  function klasse(n) { return ((n % 12) + 12) % 12; }

  // Deutscher Tonname in Helmholtz-Schreibweise (c1 = MIDI 60), zerlegt in Name und Oktavziffer
  function tonTeile(n) {
    const name = tonnamen[klasse(n)];
    const oktave = Math.floor(n / 12) - 4;
    if (oktave >= 1) return { name: name, hoch: String(oktave), tief: "" };      // a1, e2 …
    if (oktave === 0) return { name: name, hoch: "", tief: "" };                 // kleine Oktave: c
    const gross = name.charAt(0).toUpperCase() + name.slice(1);
    return { name: gross, hoch: "", tief: oktave === -1 ? "" : String(-oktave - 1) };   // C, C1, C2
  }

  function tonText(n) {
    const t = tonTeile(n);
    return t.name + t.hoch + t.tief;
  }

  // Tonname als reiner Text mit hochgestellter Ziffer (für die Auswahlliste): a¹
  function tonSchrift(n) {
    const t = tonTeile(n);
    return t.name + t.hoch.replace(/\d/g, function (z) { return "⁰¹²³⁴⁵⁶⁷⁸⁹"[z]; }) + t.tief;
  }

  // Tonname mit hochgestellter Oktavziffer (a¹), wie im Orgelbau üblich
  function tonKnoten(n) {
    const t = tonTeile(n);
    const stueck = document.createDocumentFragment();
    stueck.appendChild(document.createTextNode(t.name));
    if (t.hoch || t.tief) {
      const ziffer = document.createElement(t.hoch ? "sup" : "sub");
      ziffer.textContent = t.hoch || t.tief;
      stueck.appendChild(ziffer);
    }
    return stueck;
  }

  // Schwebung zwischen zwei Tönen über die Koinzidenzteiltöne
  function intervall(a, b) {
    const unten = Math.min(a, b), oben = Math.max(a, b);
    const typ = INTERVALLE[oben - unten];
    const differenz = typ.unten * frequenz(oben) - typ.oben * frequenz(unten);
    const rein = Math.abs(differenz) < 1e-6;
    return {
      art: typ.art,
      unten: unten,
      oben: oben,
      rate: rein ? 0 : Math.abs(differenz),                        // Schwebungen pro Sekunde
      richtung: rein ? "rein" : differenz < 0 ? "eng" : "weit"
    };
  }

  function schritteBerechnen() {
    return ZIRKEL[zirkelId].folge.map(function (f) {
      const s = intervall(f.von, f.nach);
      s.von = f.von;
      s.nach = f.nach;
      s.proben = f.proben.map(function (p) { return intervall(p[0], p[1]); });
      return s;
    });
  }

  function zirkelName(id) {
    const z = ZIRKEL[id];
    return z.titel + " " + tonSchrift(z.unten) + "–" + tonSchrift(z.oben);
  }

  let schritte = [];
  let aktuell = 0;
  let startzeit = performance.now();

  const zirkel      = document.getElementById("zirkel");
  const bahn        = document.getElementById("bahn");
  const licht       = document.getElementById("licht");
  const elSchritt   = document.getElementById("schritt");
  const elIntervall = document.getElementById("intervall");
  const elRichtung  = document.getElementById("richtung");
  const elZahl      = document.getElementById("zahl");
  const elProben    = document.getElementById("proben");

  // ----- Ring: die zwölf Töne im Quintenzirkel (a oben), dazwischen zwölf Bögen -----
  const RADIUS = 89;      // im Koordinatensystem des SVG (−100 … 100)
  const LUECKE = 9;       // Grad Abstand zwischen Bogen und Tonname
  const boegen = [];
  const toene  = [];

  function punkt(grad, radius) {
    const w = grad * Math.PI / 180;
    return [radius * Math.sin(w), -radius * Math.cos(w)];   // 0° = oben, im Uhrzeigersinn
  }

  // Platz eines Tons im Ring: a = 0, e = 1, h = 2 … (Quinten im Uhrzeigersinn)
  function platz(n) { return (((klasse(n) - 9) * 7) % 12 + 12) % 12; }

  // Bögen auf dem kürzeren Weg zwischen zwei Tönen (Quinte/Quarte: 1 Bogen, Terz: 4, Oktave: keiner)
  function pfad(von, nach) {
    const a = platz(von), b = platz(nach);
    const vor = (b - a + 12) % 12;
    const liste = [];
    if (vor <= 6) for (let i = 0; i < vor; i++) liste.push((a + i) % 12);
    else          for (let i = 0; i < 12 - vor; i++) liste.push((b + i) % 12);
    return liste;
  }

  // Erster Schritt, in dem ein Ton dieser Tonklasse gestimmt wird (der Bezugston führt zu Schritt 1)
  function schrittZuTon(tk) {
    for (let i = 0; i < schritte.length; i++) if (klasse(schritte[i].nach) === tk) return i;
    return 0;
  }

  for (let k = 0; k < 12; k++) {
    const a = punkt(k * 30 + LUECKE, RADIUS);
    const b = punkt((k + 1) * 30 - LUECKE, RADIUS);
    const bogen = document.createElementNS("http://www.w3.org/2000/svg", "path");
    bogen.setAttribute("d", "M" + a[0].toFixed(2) + " " + a[1].toFixed(2) +
      " A" + RADIUS + " " + RADIUS + " 0 0 1 " + b[0].toFixed(2) + " " + b[1].toFixed(2));
    bahn.appendChild(bogen);
    boegen.push(bogen);

    const tk  = (9 + 7 * k) % 12;                          // Tonklasse an diesem Platz
    const ort = punkt(k * 30, RADIUS / 2);                  // in Prozent der Zirkelgröße
    const ton = document.createElement("button");
    ton.type = "button";
    ton.className = "ton";
    ton.dataset.klasse = tk;
    ton.style.left = (50 + ort[0]) + "%";
    ton.style.top  = (50 + ort[1]) + "%";
    ton.addEventListener("click", function () { gehe(schrittZuTon(tk)); });
    zirkel.appendChild(ton);
    toene.push(ton);
  }

  // Proben-Bögen: innere Bahnen (eine je Probe), auf dem kürzeren Weg von Ton zu Ton
  const probenGruppe = document.createElementNS("http://www.w3.org/2000/svg", "g");
  bahn.appendChild(probenGruppe);
  let probenBoegen = [];

  function probenRadius(i) { return 78 - 7 * i; }

  function probenStrecke(p) {
    const a = platz(p.unten), b = platz(p.oben);
    const vor = (b - a + 12) % 12;
    return vor <= 6 ? { start: a * 30, spanne: vor * 30 } : { start: b * 30, spanne: (12 - vor) * 30 };
  }

  function bogenPfad(start, spanne, radius) {
    const a = punkt(start, radius), b = punkt(start + spanne, radius);
    return "M" + a[0].toFixed(2) + " " + a[1].toFixed(2) + " A" + radius + " " + radius +
      " 0 " + (spanne > 180 ? 1 : 0) + " 1 " + b[0].toFixed(2) + " " + b[1].toFixed(2);
  }

  function probenZeichnen(s) {
    probenGruppe.textContent = "";
    probenBoegen = s.proben.map(function (p, i) {
      const st = probenStrecke(p);
      const d = bogenPfad(st.start, st.spanne, probenRadius(i));
      const sichtbar = document.createElementNS("http://www.w3.org/2000/svg", "path");
      sichtbar.setAttribute("d", d);
      sichtbar.setAttribute("class", "pb " + p.richtung);
      const treffer = document.createElementNS("http://www.w3.org/2000/svg", "path");
      treffer.setAttribute("d", d);
      treffer.setAttribute("class", "treffer");
      probenGruppe.appendChild(sichtbar);
      probenGruppe.appendChild(treffer);
      return sichtbar;
    });
  }

  // Tipp in den Zirkel: auf einen Proben-Bogen = diese Probe, aufs Licht = zurück zum Hauptintervall.
  // Ausgewertet wird die Lage des Tipps, damit sich überlappende Bögen sauber trennen lassen.
  // Läuft vor den Tonnamen (Capture): ein Tipp innen auf einen Bogen springt nicht zu einem anderen Schritt.
  zirkel.addEventListener("click", function (e) {
    const s = schritte[aktuell];
    const rahmen = zirkel.getBoundingClientRect();
    const x = (e.clientX - rahmen.left) / rahmen.width * 200 - 100;
    const y = (e.clientY - rahmen.top) / rahmen.height * 200 - 100;
    const r = Math.sqrt(x * x + y * y);
    if (r < 58) { if (probeAktiv >= 0) probeWaehlen(-1); return; }
    if (r > 83) return;                                       // außen: Tonname
    let grad = Math.atan2(x, -y) * 180 / Math.PI;
    if (grad < 0) grad += 360;
    let beste = -1, abstand = Infinity;
    s.proben.forEach(function (p, i) {
      const st = probenStrecke(p);
      const rel = ((grad - st.start) % 360 + 360) % 360;
      if (rel > st.spanne + 8 && rel < 352) return;          // Tipp liegt nicht neben diesem Bogen
      const d = Math.abs(probenRadius(i) - r);
      if (d < abstand) { abstand = d; beste = i; }
    });
    if (beste >= 0) {
      e.stopPropagation();
      probeWaehlen(probeAktiv === beste ? -1 : beste);
    }
  }, true);

  function ringBeschriften() {
    toene.forEach(function (ton) {
      const tk = Number(ton.dataset.klasse);
      const i = schrittZuTon(tk), s = schritte[i];
      ton.textContent = tonnamen[tk];
      ton.setAttribute("aria-label", tonnamen[tk] + ": zu Schritt " + (i + 1) + ", " +
        s.art + " " + tonText(s.von) + " – " + tonText(s.nach));
    });
  }

  // ----- Anzeige -----
  function probeZeile(p, i) {
    const zeile = document.createElement("button");
    zeile.type = "button";
    zeile.className = "probe";
    zeile.setAttribute("aria-pressed", "false");
    zeile.addEventListener("click", function () { probeWaehlen(probeAktiv === i ? -1 : i); });
    const vor = document.createElement("span");
    vor.className = "vor";
    vor.textContent = "Probe: ";
    zeile.appendChild(vor);
    zeile.appendChild(document.createTextNode(p.art + " "));
    const toene2 = document.createElement("span");
    toene2.className = "ton2";
    toene2.appendChild(tonKnoten(p.unten));
    toene2.appendChild(document.createTextNode(" – "));
    toene2.appendChild(tonKnoten(p.oben));
    zeile.appendChild(toene2);
    zeile.appendChild(document.createTextNode("  "));
    const richtung = document.createElement("span");
    richtung.className = p.richtung;
    richtung.textContent = p.richtung;
    zeile.appendChild(richtung);
    const wert = document.createElement("span");
    wert.className = "wert";
    wert.textContent = "  " + p.rate.toFixed(2).replace(".", ",") + "/s";
    zeile.appendChild(wert);
    return zeile;
  }

  function anzeigen() {
    const s = schritte[aktuell];

    document.body.className = s.richtung;

    elSchritt.textContent = "Schritt " + (aktuell + 1) + "/" + schritte.length;
    elIntervall.textContent = s.art + " ";
    elIntervall.appendChild(tonKnoten(s.von));
    elIntervall.appendChild(document.createTextNode(" – "));
    elIntervall.appendChild(tonKnoten(s.nach));
    elRichtung.textContent = s.richtung;
    elZahl.textContent = s.rate.toFixed(2).replace(".", ",");

    elProben.textContent = "";
    s.proben.forEach(function (p, i) { elProben.appendChild(probeZeile(p, i)); });
    probenZeichnen(s);

    // Ring: Zielton farbig, Ausgangston hell, schon gestimmte Töne halbhell
    const gestimmt = { };
    gestimmt[klasse(ZIRKEL[zirkelId].bezugston)] = true;
    const fertigeBoegen = { };
    for (let i = 0; i < aktuell; i++) {
      gestimmt[klasse(schritte[i].nach)] = true;
      pfad(schritte[i].von, schritte[i].nach).forEach(function (b) { fertigeBoegen[b] = true; });
    }
    const aktiveBoegen = { };
    pfad(s.von, s.nach).forEach(function (b) { aktiveBoegen[b] = true; });

    for (let k = 0; k < 12; k++) {
      boegen[k].setAttribute("class", aktiveBoegen[k] ? "aktiv" : fertigeBoegen[k] ? "fertig" : "");
      const tk = Number(toene[k].dataset.klasse);
      const ziel = tk === klasse(s.nach);
      toene[k].className = "ton" + (ziel ? " ziel" : tk === klasse(s.von) ? " bezug" : gestimmt[tk] ? " fertig" : "");
      if (ziel) toene[k].setAttribute("aria-current", "step");
      else toene[k].removeAttribute("aria-current");
    }

    probeWaehlen(-1);                   // das Licht folgt zunächst dem Hauptintervall
  }

  // Probe antippen: das Licht pulsiert in ihrem Takt und ihrer Farbe; nochmal tippen = zurück
  let probeAktiv = -1;
  const elAngaben = document.getElementById("angaben");

  function probeWaehlen(i) {
    const s = schritte[aktuell];
    probeAktiv = i >= 0 && i < s.proben.length ? i : -1;
    const zeilen = elProben.children;
    for (let k = 0; k < zeilen.length; k++) {
      zeilen[k].classList.toggle("an", k === probeAktiv);
      zeilen[k].setAttribute("aria-pressed", k === probeAktiv ? "true" : "false");
    }
    probenBoegen.forEach(function (b, k) { b.classList.toggle("an", k === probeAktiv); });
    elAngaben.classList.toggle("probe-an", probeAktiv >= 0);
    const p = probeAktiv >= 0 ? s.proben[probeAktiv] : null;
    licht.className = "licht" + (p ? " " + p.richtung : "");
    toene.forEach(function (ton) {
      ton.classList.remove("probe-eng", "probe-weit", "probe-rein");
      const tk = Number(ton.dataset.klasse);
      if (p && (tk === klasse(p.unten) || tk === klasse(p.oben))) ton.classList.add("probe-" + p.richtung);
    });
    startzeit = performance.now();      // beginnt hell
  }

  function lichtRate() {
    const s = schritte[aktuell];
    return probeAktiv >= 0 ? s.proben[probeAktiv].rate : s.rate;
  }

  function gehe(nummer) {
    aktuell = (nummer + schritte.length) % schritte.length;
    anzeigen();
    messen();                           // falls der Browser eine Größenänderung nicht gemeldet hat
    wachHalten();
  }

  // Helligkeit ∝ |cos(π · Schwebungsrate · t)|
  function bild(jetzt) {
    const t = (jetzt - startzeit) / 1000;
    licht.style.opacity = Math.abs(Math.cos(Math.PI * lichtRate() * t));
    requestAnimationFrame(bild);
  }

  // ----- Bedienung -----
  document.getElementById("zurueck").addEventListener("click", function () { gehe(aktuell - 1); });
  document.getElementById("weiter").addEventListener("click", function () { gehe(aktuell + 1); });

  // Pfeiltasten (auch Bluetooth-Fußtaster zum Umblättern)
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.tagName === "SELECT") return;
    if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); gehe(aktuell + 1); }
    if (e.key === "ArrowLeft"  || e.key === "ArrowUp"   || e.key === "PageUp")   { e.preventDefault(); gehe(aktuell - 1); }
  });

  // Bildschirm anlassen, solange die Seite zu sehen ist (wo der Browser das erlaubt)
  let wachSperre = null;
  function wachHalten() {
    if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
    if (wachSperre && !wachSperre.released) return;
    navigator.wakeLock.request("screen").then(function (sperre) { wachSperre = sperre; }).catch(function () {});
  }
  document.addEventListener("visibilitychange", wachHalten);

  // ----- Zirkel wählen: Tipp auf den Zirkelnamen öffnet die Auswahl -----
  const elZirkelname = document.getElementById("zirkelname");
  const zirkelwahl   = document.getElementById("zirkelwahl");

  Object.keys(ZIRKEL).forEach(function (id) {
    const option = document.createElement("option");
    option.value = id;
    option.textContent = zirkelName(id);
    zirkelwahl.appendChild(option);
  });

  function zirkelWaehlen(id) {
    if (!ZIRKEL[id]) id = "quinten";
    zirkelId = id;
    tonnamen = ZIRKEL[id].tonnamen;
    try { localStorage.setItem(SPEICHER_ZIRKEL, id); } catch (e) {}
    zirkelwahl.value = id;
    elZirkelname.textContent = zirkelName(id);
    schritte = schritteBerechnen();
    elProben.hidden = !schritte.some(function (s) { return s.proben.length > 0; });
    aktuell = 0;
    ringBeschriften();
    anzeigen();
    messen();
  }

  zirkelwahl.addEventListener("change", function () {
    zirkelWaehlen(zirkelwahl.value);
    zirkelwahl.blur();
  });

  // ----- Kammerton einstellen: Tipp auf „a¹ = 440 Hz“ öffnet ein Zahlenfeld -----
  const elKammerton = document.getElementById("kammerton");
  const feld        = document.getElementById("feld");
  const eingabe     = document.getElementById("eingabe");

  function kammertonZeigen() {
    const wert = String(kammerton).replace(".", ",");
    elKammerton.textContent = "";
    elKammerton.appendChild(tonKnoten(A1_MIDI));
    elKammerton.appendChild(document.createTextNode(" = " + wert + " Hz"));
    elKammerton.setAttribute("aria-label", "Kammerton a1 = " + wert + " Hertz, ändern");
  }

  function kammertonSetzen(wert) {
    if (!(wert >= HZ_MIN && wert <= HZ_MAX)) return;      // Unsinn wird verworfen
    kammerton = Math.round(wert * 10) / 10;
    try { localStorage.setItem(SPEICHER, String(kammerton)); } catch (e) {}
    schritte = schritteBerechnen();
    kammertonZeigen();
    anzeigen();
  }

  function eingabeBeenden(uebernehmen) {
    if (feld.hidden) return;
    feld.hidden = true;
    elKammerton.hidden = false;
    if (uebernehmen) kammertonSetzen(parseFloat(eingabe.value.replace(",", ".")));
  }

  elKammerton.addEventListener("click", function () {
    elKammerton.hidden = true;
    feld.hidden = false;
    eingabe.value = String(kammerton).replace(".", ",");
    eingabe.focus();
    eingabe.select();
  });
  eingabe.addEventListener("blur", function () { eingabeBeenden(true); });
  eingabe.addEventListener("keydown", function (e) {
    e.stopPropagation();                                   // Pfeiltasten gehören hier dem Feld
    if (e.key === "Enter")  { eingabeBeenden(true);  eingabe.blur(); }
    if (e.key === "Escape") { eingabeBeenden(false); eingabe.blur(); }
  });

  // ----- Größe: der Zirkel bekommt genau den Platz, der zwischen Kopfzeile und Tasten frei ist -----
  const buehne  = document.getElementById("buehne");
  const angaben = document.getElementById("angaben");
  const quer    = window.matchMedia("(orientation: landscape) and (max-height: 540px)");
  let durchmesser = 0;

  function messen() {
    const breite = buehne.clientWidth, hoehe = buehne.clientHeight;
    const platz = quer.matches ? Math.min(breite * 0.42, hoehe - 12)
                               : Math.min(breite, hoehe - angaben.offsetHeight - 8);
    const d = Math.max(120, Math.min(460, Math.floor(platz)));
    if (d !== durchmesser) {
      durchmesser = d;
      document.documentElement.style.setProperty("--d", d + "px");
    }
  }
  window.addEventListener("resize", messen);
  window.addEventListener("orientationchange", messen);
  if ("ResizeObserver" in window) new ResizeObserver(messen).observe(buehne);

  // ----- Start -----
  zirkelWaehlen(gemerkterZirkel);
  kammertonZeigen();
  wachHalten();
  requestAnimationFrame(bild);

  // Offline-Betrieb: Service Worker hält die Seite auf dem Gerät vor
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>

</body>
</html>
